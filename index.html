<!doctype html>
<html lang="fr" data-couleur="bleu" data-mode="clair" data-daltonien="non">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma Santé</title>
  <meta name="description" content="Suivi personnel : médicaments, signes vitaux, ordonnances et notes.">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.json">
  <link id="favicon" rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="saison-deco" aria-hidden="true"></div>

  <!-- Connexion -->
  <section id="login" class="login hidden">
    <div class="login-card card">
      <div class="login-logo brand-logo" id="login-logo"></div>
      <h1><span class="site-nom">Ma Santé</span> <span class="saison-emoji"></span></h1>
      <p class="muted">Connecte-toi pour accéder à ton suivi.</p>
      <form id="login-form" class="form">
        <label>Identifiant<input name="identifiant" autocomplete="username" autocapitalize="none" required></label>
        <label>Mot de passe<input name="motdepasse" type="password" autocomplete="current-password" required></label>
        <label class="check"><input type="checkbox" name="rester" checked> Rester connecté sur cet appareil</label>
        <button class="btn primary block" type="submit">Se connecter</button>
        <p class="form-error" id="login-error" role="alert"></p>
      </form>
      <div class="login-extra">
        <button class="btn ghost block hidden" id="btn-pin-login" type="button">🔢 Connexion par code PIN</button>
        <button class="btn danger block hidden" id="btn-urgence-login" type="button">🚑 Fiche d'urgence</button>
      </div>
    </div>
  </section>

  <!-- Code PIN -->
  <section id="pin-screen" class="login hidden">
    <div class="login-card card pin-card">
      <div class="login-logo brand-logo"></div>
      <p class="pin-site"><span class="site-nom">Ma Santé</span> <span class="saison-emoji"></span></p>
      <div id="pin-box"></div>
    </div>
  </section>

  <!-- Application -->
  <div id="app" class="hidden">
    <header class="topbar">
      <a href="#accueil" class="brand">
        <span class="brand-logo" id="brand-logo"></span>
        <span class="site-nom">Ma Santé</span>
        <span class="saison-emoji"></span>
      </a>
      <div class="topbar-right">
        <label class="view-as hidden" id="view-as-wrap" title="Voir les données de">
          <span class="sr-only">Voir les données de</span>
          <select id="view-as"></select>
        </label>
        <a href="#compte" class="avatar" id="top-avatar" aria-label="Mon compte"></a>
      </div>
    </header>
    <div id="ro-banner" class="ro-banner hidden"></div>
    <nav class="sidebar" id="sidebar" aria-label="Navigation principale"></nav>
    <main id="page" class="page" tabindex="-1"></main>
    <nav class="bottomnav" id="bottomnav" aria-label="Navigation"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="loader" class="loader hidden" aria-hidden="true"><div class="spinner"></div></div>

  <!-- Librairies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- Application -->
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sons.js"></script>
  <script src="js/saisons.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/export.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/accueil.js"></script>
  <script src="js/pages/medicaments.js"></script>
  <script src="js/pages/signes.js"></script>
  <script src="js/pages/ordonnances.js"></script>
  <script src="js/pages/historique.js"></script>
  <script src="js/pages/notes.js"></script>
  <script src="js/pages/compte.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/urgence.js"></script>
  <script src="js/pages/rapport.js"></script>
  <script src="js/pin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
